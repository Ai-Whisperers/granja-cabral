services:
  web:
    build: .
    image: granja-cabral:prod
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.granja-cabral.rule=Host(`granja-cabral.paragu-ai.com`)"
      - "traefik.http.routers.granja-cabral.entrypoints=websecure"
      - "traefik.http.services.granja-cabral.loadbalancer.server.port=3000"
